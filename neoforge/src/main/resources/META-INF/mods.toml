modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = "${mod_description}"
authors = "${mod_authors}"


[[mixins]]
config = "champions-common.mixins.json"

[[mods.dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[mods.dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Architectury API — required at runtime
[[mods.dependencies.${ mod_id }]]
modId = "architectury"
type = "required"
versionRange = "*"
ordering = "NONE"
side = "BOTH"

# KubeJS — optional integration
[[mods.dependencies.${ mod_id }]]
modId = "kubejs"
type = "optional"
versionRange = "${kubejs_version_range}"
ordering = "NONE"
side = "BOTH"

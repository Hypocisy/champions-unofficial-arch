plugins {
    id "architectury-plugin"
    id "com.gradleup.shadow"
}

architectury {
    fabric()
}

base {
    archivesName = "${mod_id}-fabric"
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    accessWidenerPath = file("../common/src/main/resources/champions.accesswidener")
}
dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
    // Replace modImplementation with modApi if you expose components in your own API
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"
    // Copy the following only if you want to bundle Cardinal Components API as a Jar-in-Jar dependency
    // (otherwise, you should configure the dependency on Modrinth/Curseforge)
    include "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"
    modRuntimeOnly "curse.maven:modmenu-308702:7808443"
    modImplementation ("curse.maven:forge-config-api-port-547434:${rootProject.forge_config_api_port_fileid}")

    // night-config: FCAP bundles these as JiJ which Fabric Loader extracts at production runtime.
    // In dev, Loom never extracts JiJ from classpath mods, so declare them directly here.
    // `include` is NOT needed — FCAP's own JiJ handles production.
    implementation("com.electronwill.night-config:core:3.8.3")
    implementation("com.electronwill.night-config:toml:3.8.3")

    // KubeJS Fabric (optional)
//    modCompileOnly "dev.latvian.mods:kubejs-fabric:${kubejs_version}"

    // Jade (optional)
    modCompileOnly "curse.maven:jade-324717:${rootProject.jade_cf_fileid}"

}

// ── Jar assembly ─────────────────────────────────────────────────────────────

processResources {
    def props = [
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_version                : mod_version,
            mod_license                : mod_license,
            mod_authors                : mod_authors,
            mod_description            : mod_description,
            fabric_loader_version_range: fabric_loader_version_range,
            minecraft_version          : minecraft_version,
    ]
    inputs.properties(props)
    filesMatching("fabric.mod.json") { expand(props) }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = ""
}

jar {
    archiveClassifier = "dev"
}

// ── Data generation ───────────────────────────────────────────────────────────

loom {
    runs {
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources").absolutePath}"
            vmArg "-Dfabric-api.datagen.modid=champions"
            runDir "build/datagen"
        }
    }
}

sourceSets.main.resources.srcDirs += ["src/generated/resources"]

// ── Publishing ────────────────────────────────────────────────────────────────

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = "${mod_id}-fabric"
            artifact(remapJar) { builtBy remapJar }
            artifact(sourcesJar) { builtBy remapSourcesJar }
        }
    }
}

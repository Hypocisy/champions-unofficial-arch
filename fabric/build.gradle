plugins {
    id "architectury-plugin"
    id "com.gradleup.shadow"
    id "com.modrinth.minotaur"
    id "net.darkhax.curseforgegradle"
}

architectury {
    fabric()
}

base {
    archivesName = "${mod_id}-fabric"
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    accessWidenerPath = file("../common/src/main/resources/champions.accesswidener")
}

// ── Mod publishing — run `./gradlew publishModPlatforms` from the root ───────

def modrinthToken = System.getenv("MODRINTH_TOKEN") ?: (findProperty("modrinth_token") ?: "")
def curseforgeToken = System.getenv("CURSEFORGE_TOKEN") ?: (findProperty("curseforge_token") ?: "")

def hasModrinth = !modrinthToken.toString().blank && !("${findProperty("modrinth_project_id") ?: ""}").blank
def hasCurseforge = !curseforgeToken.toString().blank && !("${findProperty("curseforge_id") ?: ""}").blank

modrinth {
    token = modrinthToken
    projectId = "${findProperty("modrinth_project_id") ?: ""}"
    versionNumber = "${project.version}-fabric"
    versionName = "${mod_name} ${project.version} (Fabric)"
    versionType = "release"
    changelog = rootProject.ext.releaseChangelog()
    uploadFile = remapJar
    gameVersions = ["${minecraft_version}"]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        required.project "forge-config-api-port"
        optional.project "jade"
        optional.project "modmenu"
    }
}

tasks.register("curseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = "publishing"
    onlyIf {
        boolean tokenOk = !curseforgeToken.toString().blank
        boolean idOk = !("${findProperty("curseforge_id") ?: ""}").trim().blank
        if (tokenOk && idOk) return true
        def why = []
        if (!tokenOk) why << "token missing (env CURSEFORGE_TOKEN / gradle prop curseforge_token)"
        if (!idOk) why << "curseforge_id missing in gradle.properties"
        logger.lifecycle("SKIPPED :fabric:curseforge — ${why.join('; ')}. " +
                "If you just set the env var, RESTART the terminal first, or put tokens in ~/.gradle/gradle.properties.")
        return false
    }
    dependsOn remapJar
    apiToken = curseforgeToken
    debugMode = Boolean.parseBoolean(System.getenv("CF_DEBUG") ?: "false")
    def cfProjectId = "${findProperty("curseforge_id") ?: ""}".trim()
    if (cfProjectId) upload(cfProjectId, remapJar.archiveFile.get().asFile) {
        displayName = "${mod_name} ${project.version}"
        releaseType = "release"
        changelog = rootProject.ext.releaseChangelog()
        changelogType = "markdown"
        addGameVersion("${minecraft_version}")
        addEnvironment("Client", "Server")
        addJavaVersion("Java 21")
        addModLoader("Fabric")
        addRequirement("fabric-api", "forge-config-api-port")
        addOptional("jade", "modmenu")
    }
}

tasks.named("modrinth") {
    onlyIf {
        boolean tokenOk = !modrinthToken.toString().blank
        boolean idOk = !("${findProperty("modrinth_project_id") ?: ""}").blank
        if (tokenOk && idOk) return true
        def why = []
        if (!tokenOk) why << "token missing (env MODRINTH_TOKEN / gradle prop modrinth_token)"
        if (!idOk) why << "modrinth_project_id missing in gradle.properties"
        logger.lifecycle("SKIPPED :fabric:modrinth — ${why.join('; ')}. " +
                "If you just set the env var, RESTART the terminal first, or put tokens in ~/.gradle/gradle.properties.")
        return false
    }
}
dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
    // Replace modImplementation with modApi if you expose components in your own API
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"
    // Copy the following only if you want to bundle Cardinal Components API as a Jar-in-Jar dependency
    // (otherwise, you should configure the dependency on Modrinth/Curseforge)
    include "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"
    modRuntimeOnly "curse.maven:modmenu-308702:7808443"
    modImplementation ("curse.maven:forge-config-api-port-547434:${rootProject.forge_config_api_port_fileid}")

    // night-config: FCAP bundles these as JiJ which Fabric Loader extracts at production runtime.
    // In dev, Loom never extracts JiJ from classpath mods, so declare them directly here.
    // `include` is NOT needed — FCAP's own JiJ handles production.
    implementation("com.electronwill.night-config:core:3.8.3")
    implementation("com.electronwill.night-config:toml:3.8.3")

    // KubeJS Fabric (optional)
//    modCompileOnly "dev.latvian.mods:kubejs-fabric:${kubejs_version}"

    // Jade (optional)
    modCompileOnly "curse.maven:jade-324717:${rootProject.jade_cf_fileid}"

}

// ── Jar assembly ─────────────────────────────────────────────────────────────

processResources {
    def props = [
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_version                : mod_version,
            mod_license                : mod_license,
            mod_authors                : mod_authors,
            mod_description            : mod_description,
            fabric_loader_version_range: fabric_loader_version_range,
            minecraft_version          : minecraft_version,
    ]
    inputs.properties(props)
    filesMatching("fabric.mod.json") { expand(props) }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = ""
}

jar {
    archiveClassifier = "dev"
}

// ── Data generation ───────────────────────────────────────────────────────────

loom {
    runs {
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources").absolutePath}"
            vmArg "-Dfabric-api.datagen.modid=champions"
            runDir "build/datagen"
        }
    }
}

sourceSets.main.resources.srcDirs += ["src/generated/resources"]

// ── Publishing ────────────────────────────────────────────────────────────────

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = "${mod_id}-fabric"
            artifact(remapJar) { builtBy remapJar }
            artifact(sourcesJar) { builtBy remapSourcesJar }
        }
    }
}

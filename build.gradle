plugins {
    id "architectury-plugin" version "${architectury_plugin_version}"
    id "dev.architectury.loom" version "${architectury_loom_version}" apply false
    id 'com.gradleup.shadow' version '8.3.6' apply false
    // Mod platform publishing (see PUBLISHING.md)
    id "com.modrinth.minotaur" version "2.8.7" apply false
    id "net.darkhax.curseforgegradle" version "1.1.28" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = mod_group_id
    version = mod_version

    repositories {
        mavenCentral()
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.parchmentmc.org" }
        maven {
            name = "Ladysnake Mods"
            url = 'https://maven.ladysnake.org/releases'
        }

        maven {
            url "https://maven.latvian.dev/releases"
            content {
                includeGroup "dev.latvian.mods"
                includeGroup "dev.latvian.apps"
            }
        }

        maven {
            url "https://jitpack.io"
            content {
                includeGroup "com.github.rtyley"
            }
        }
        maven { // TOP
            name 'tterrag maven'
            url "https://maven.tterrag.com/"
        }
        maven {
            url "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        mavenLocal()
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = rootProject.java_version as int
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        implementation 'com.google.code.findbugs:jsr305:3.0.2'
        mappings loom.officialMojangMappings()
    }
}

// ── Release helpers ─────────────────────────────────────────────────────────

/**
 * Extracts the CHANGELOG.md section for the current mod version
 * (`## [<version>]` up to the next `## [` header) for upload release notes.
 */
ext.releaseChangelog = {
    def text = rootProject.file("CHANGELOG.md").getText("UTF-8")
    def version = rootProject.version.toString()
    def lines = text.split('\\n')
    def out = []
    def inSection = false
    for (line in lines) {
        if (line.startsWith("## [")) {
            if (inSection) break
            inSection = line.startsWith("## [${version}]")
        } else if (inSection) {
            out << line
        }
    }
    if (out.isEmpty()) {
        throw new GradleException("CHANGELOG.md has no section for [${version}] — add '## [${version}]' before publishing.")
    }
    return out.join('\n').trim()
}

/** One-click: build both platform jars and upload to Modrinth + CurseForge. */
tasks.register("publishModPlatforms") {
    group = "publishing"
    description = "Builds both platform jars and uploads them to Modrinth and CurseForge."
    dependsOn ":fabric:modrinth", ":fabric:curseforge",
            ":neoforge:modrinth", ":neoforge:curseforge"
}

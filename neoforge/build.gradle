plugins {
    id 'com.gradleup.shadow'
    id "com.modrinth.minotaur"
    id "net.darkhax.curseforgegradle"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}


base {
    archivesName = "${mod_id}-neoforge"
}

// Pull in the common module's compiled classes before remapping.
// Architectury Loom merges common + neoforge into a single jar at remapJar time.
configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // NeoForge itself
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    // Architectury API NeoForge module
    modApi "dev.architectury:architectury-neoforge:${architectury_api_version}"

    // Common module (merged at remapJar time, not a runtime dep)
    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge")) {
        transitive = false
    }

    // KubeJS NeoForge (optional)
    modCompileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"

    // The One Probe (optional)
    modCompileOnly "curse.maven:the-one-probe-245211:7292875"

    // Jade (optional)
    modCompileOnly "curse.maven:jade-324717:${rootProject.jade_cf_fileid}"
    modImplementation "curse.maven:jade-324717:${rootProject.jade_cf_fileid}"
}

// ── Jar assembly ─────────────────────────────────────────────────────────────

processResources {
    // Inject version and dependency ranges into neoforge.mods.toml
    def props = [
            mod_id                       : mod_id,
            mod_name                     : mod_name,
            mod_version                  : mod_version,
            mod_license                  : mod_license,
            mod_authors                  : mod_authors,
            mod_description              : mod_description,
            minecraft_version_range      : minecraft_version_range,
            neoforge_version_range       : neoforge_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
            kubejs_version_range         : kubejs_version_range
    ]
    inputs.properties(props)
    filesMatching("META-INF/neoforge.mods.toml") { expand(props) }
}

shadowJar {
    // Merge common classes into this jar
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

jar {
    archiveClassifier = "dev"
}

// ── Data generation ───────────────────────────────────────────────────────────

loom {
    neoForge {
        accessTransformers.from(file("src/main/resources/META-INF/accesstransformer.cfg"))
    }

    runs {
        data {
            data()

            programArgs.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath(),
                '--existing', project(':common').file('src/main/resources/').getAbsolutePath()
        }
    }

}

// Make the main source set pick up generated resources at runtime
sourceSets.main.resources.srcDirs += ["src/generated/resources"]

// ── Mod publishing — run `./gradlew publishModPlatforms` from the root ───────

def modrinthToken = System.getenv("MODRINTH_TOKEN") ?: (findProperty("modrinth_token") ?: "")
def curseforgeToken = System.getenv("CURSEFORGE_TOKEN") ?: (findProperty("curseforge_token") ?: "")

def hasModrinth = !modrinthToken.toString().blank && !("${findProperty("modrinth_project_id") ?: ""}").blank
def hasCurseforge = !curseforgeToken.toString().blank && !("${findProperty("curseforge_id") ?: ""}").blank

modrinth {
    token = modrinthToken
    projectId = "${findProperty("modrinth_project_id") ?: ""}"
    versionNumber = "${project.version}-neoforge"
    versionName = "${mod_name} ${project.version} (NeoForge)"
    versionType = "release"
    changelog = rootProject.ext.releaseChangelog()
    uploadFile = remapJar
    gameVersions = ["${minecraft_version}"]
    loaders = ["neoforge"]
    dependencies {
        required.project "architectury-api"
        optional.project "kubejs"
        optional.project "jade"
        optional.project "the-one-probe"
    }
}

tasks.register("curseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = "publishing"
    onlyIf { hasCurseforge }
    dependsOn remapJar
    apiToken = curseforgeToken
    debugMode = Boolean.parseBoolean(System.getenv("CF_DEBUG") ?: "false")
    def cfProjectId = "${findProperty("curseforge_id") ?: ""}".trim()
    if (cfProjectId) upload(cfProjectId, remapJar.archiveFile.get().asFile) {
        displayName = "${mod_name} ${project.version} (NeoForge)"
        releaseType = "release"
        changelog = rootProject.ext.releaseChangelog()
        changelogType = "markdown"
        addGameVersion("${minecraft_version}")
        addModLoader("NeoForge")
        addRequirement("architectury-api")
        addOptional("kubejs", "jade", "the-one-probe")
    }
}

tasks.named("modrinth") { onlyIf { hasModrinth } }

// ── Publishing ────────────────────────────────────────────────────────────────

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = "${mod_id}-neoforge"
            artifact(remapJar) { builtBy remapJar }
            artifact(sourcesJar) { builtBy remapSourcesJar }
        }
    }
}
